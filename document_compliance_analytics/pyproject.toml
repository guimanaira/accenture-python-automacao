[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-compliance-analytics"
version = "0.1.0"
description = "Conferência documental de processos de financiamento imobiliário"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.scripts]
document-check = "doccheck.cli:main"

[tool.setuptools.packages.find]
include = ["doccheck*"]
